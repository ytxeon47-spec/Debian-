name: Debian Linux Auto-Login Desktop Tailscale

on:
  workflow_dispatch:

jobs:
  secure-desktop:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Install Desktop Environment & VNC Services
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 xfce4-goodies x11vnc xvfb zenity net-tools
          
      - name: Setup Auto-Login Desktop Session
        run: |
          USERNAME="MXDEV"
          
          # Создание пользователя без необходимости ввода пароля
          if ! id -u "$USERNAME" >/dev/null 2>&1; then
              sudo useradd -m -s /bin/bash "$USERNAME"
              sudo passwd -d "$USERNAME"
              sudo usermod -aG sudo "$USERNAME"
          fi
          
          USER_HOME="/home/$USERNAME"
          
          # Создание приветственного окна при входе
          sudo mkdir -p "$USER_HOME/.config/autostart"
          cat << 'EOF' | sudo tee "$USER_HOME/.config/autostart/mxdev-welcome.desktop" > /dev/null
          [Desktop Entry]
          Type=Application
          Name=MX DEV Welcome
          Exec=bash -c "sleep 3 && zenity --info --title='Welcome from MX DEV' --text='Welcome! This session is provided by MX DEV.\n\nSubscribe to our Telegram channel for more methods and updates:\nhttps://t.me/mxdevrdp' --width=400"
          Hidden=false
          NoDisplay=false
          X-GNOME-Autostart-enabled=true
          EOF

          sudo chown -R "$USERNAME:$USERNAME" "$USER_HOME"

          # Запуск виртуального дисплея (Xvfb) и сессии XFCE от имени MXDEV
          sudo -u "$USERNAME" nohup Xvfb :1 -screen 0 1280x720x24 > /dev/null 2>&1 &
          sleep 2
          sudo -u "$USERNAME" DISPLAY=:1 nohup startxfce4 > /dev/null 2>&1 &
          sleep 3

          # Запуск X11VNC без пароля (NOPASSWD)
          sudo -u "$USERNAME" DISPLAY=:1 nohup x11vnc -forever -shared -nopw -rfbport 5900 > /dev/null 2>&1 &
          
          echo "RDP_USER=$USERNAME" >> $GITHUB_ENV

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Establish Tailscale Connection
        run: |
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-$GITHUB_RUN_ID
          
          TS_IP=""
          RETRIES=0
          while [ -z "$TS_IP" ] && [ $RETRIES -lt 10 ]; do
              TS_IP=$(tailscale ip -4)
              sleep 5
              RETRIES=$((RETRIES+1))
          done
          
          if [ -z "$TS_IP" ]; then
              echo "Tailscale IP not assigned. Exiting."
              exit 1
          fi
          
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: Verify Connections
        run: |
          echo "Tailscale IP: $TAILSCALE_IP"
          
          if nc -z -v -w5 127.0.0.1 5900 2>/dev/null; then
              echo "VNC Auto-Login Port (5900): Active"
          else
              echo "VNC server failed to start"
          fi

      - name: Maintain Connection
        run: |
          echo -e "\n======================================================="
          echo " This session is brought to you by MX DEV!"
          echo " Subscribe to our Telegram channel for more methods:"
          echo " https://t.me/mxdevrdp"
          echo -e "=======================================================\n"
          
          echo -e "\n=== CONNECT INFO (NO PASSWORD) ==="
          echo "Address:     $TAILSCALE_IP"
          echo "VNC Port:    5900 (Display :0 or :1)"
          echo "User Logged: $RDP_USER (Auto-Logged In)"
          echo "Password:    NONE (Direct Access)"
          echo -e "==================================\n"
          
          while true; do
              echo "[$(date)] Auto-login Session Active - MX DEV (https://t.me/mxdevrdp)"
              sleep 300
          done

