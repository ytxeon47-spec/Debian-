name: Custom Windows 7 QEMU (AMD Phenom II X4 965 & Supermium CD Drive)

on:
  workflow_dispatch:

jobs:
  run-win7-supermium:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: 1. Install QEMU, KVM & Storage Tools
        run: |
          echo "=== [STEP 1/5] Installing QEMU, KVM & Storage Tools ==="
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            qemu-utils \
            novnc \
            websockify \
            curl \
            wget \
            aria2 \
            genisoimage

          echo "=== Enabling KVM Permissions ==="
          sudo chmod 666 /dev/kvm || true

          echo "=== Creating Main Virtual Disk (128GB qcow2) ==="
          qemu-img create -f qcow2 /tmp/main_disk.qcow2 128G

      - name: 2. Download Windows 7 ISO
        run: |
          echo "=== [STEP 2/5] Downloading Windows 7 ISO ==="
          
          ISO_URL="https://archive.org/download/windows-7-sp-1-x-64-rus-05.2024/Windows%207%20SP1%20x64%20Rus%20Activated%2005.2024.iso"
          
          echo "Downloading ISO to /tmp/win7.iso..."
          aria2c -x 16 -s 16 -k 1M -d /tmp -o win7.iso "$ISO_URL" || wget -O /tmp/win7.iso "$ISO_URL"
          
          ls -lh /tmp/win7.iso

      - name: 3. Download Supermium Browser & Create Extra CD ISO
        run: |
          echo "=== [STEP 3/5] Downloading Supermium & Creating Extra CD ISO ==="
          
          SUPERMIUM_URL="https://download.win32subsystem.live/supermium/releases/v144-r5/supermium_144_64_setup.exe"
          
          mkdir -p /tmp/supermium_files
          echo "Downloading Supermium installer..."
          aria2c -x 16 -s 16 -k 1M -d /tmp/supermium_files -o supermium_144_64_setup.exe "$SUPERMIUM_URL" || wget -O /tmp/supermium_files/supermium_144_64_setup.exe "$SUPERMIUM_URL"
          
          echo "Creating CD ISO image with Supermium installer..."
          genisoimage -V "SUPERMIUM" -J -R -o /tmp/supermium_disk.iso /tmp/supermium_files
          
          ls -lh /tmp/supermium_disk.iso

      - name: 4. Connect Tailscale
        run: |
          echo "=== [STEP 4/5] Connecting Tailscale ==="
          curl -fsSL https://tailscale.com/install.sh | sh
          
          sudo tailscale up \
            --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" \
            --hostname="win7-qemu-runner-${{ github.run_id }}" \
            --accept-routes || true
          
          TS_IP=""
          RETRIES=0
          while [ -z "$TS_IP" ] && [ $RETRIES -lt 10 ]; do
              TS_IP=$(tailscale ip -4 || true)
              sleep 3
              RETRIES=$((RETRIES+1))
          done
          
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: 5. Launch QEMU Windows 7 & noVNC Web Access
        run: |
          echo "=== [STEP 5/5] Starting QEMU Windows 7 Machine ==="
          
          # Запуск QEMU: AMD Phenom II X4 965 (4 ядра / 4 потока), 8 GB RAM, Диск 128 ГБ + CD ISO с Supermium
          qemu-system-x86_64 \
            -enable-kvm \
            -m 8192 \
            -smp 4,sockets=1,cores=4,threads=1 \
            -cpu host,model-id="AMD Phenom(tm) II X4 965 Processor",check=false \
            -drive file=/tmp/main_disk.qcow2,format=qcow2,index=0,media=disk \
            -drive file=/tmp/win7.iso,index=1,media=cdrom \
            -drive file=/tmp/supermium_disk.iso,index=2,media=cdrom \
            -vga std \
            -boot d \
            -vnc 127.0.0.1:0 \
            -net nic,model=e1000 \
            -net user \
            -usb -device usb-tablet \
            -daemonize

          sleep 5

          # Настройка noVNC
          NOVNC_DIR="/usr/share/novnc"
          if [ -d "/usr/share/novnc/vnc_lite.html" ] || [ -f "/usr/share/novnc/vnc.html" ] || [ -f "/usr/share/novnc/index.html" ]; then
            NOVNC_DIR="/usr/share/novnc"
          elif [ -d "/usr/share/novnc" ]; then
            NOVNC_DIR="/usr/share/novnc"
          fi

          websockify --web "$NOVNC_DIR" 8006 127.0.0.1:5900 &
          sleep 2

          echo "=================================================="
          echo " WINDOWS 7 QEMU READY"
          echo "=================================================="
          echo " OS Image     : Windows 7 SP1 x64 Rus Activated (05.2024)"
          echo " CPU Model    : AMD Phenom(tm) II X4 965 Processor (4 Cores, 2009)"
          echo " RAM          : 8 GB (8192 MB)"
          echo " Storage Size : 128 GB Main Disk"
          echo " Extra Drive  : CD/DVD Drive (SUPERMIUM) with supermium_144_64_setup.exe"
          echo " Tailscale IP : $TAILSCALE_IP"
          echo " Web VNC URL  : http://$TAILSCALE_IP:8006/vnc.html"
          echo "=================================================="

          # Удерживаем раннер 6 часов
          END_TIME=$(( $(date +%s) + 21600 ))
          while [ $(date +%s) -lt $END_TIME ]; do
            sleep 300
            echo "QEMU Running | Tailscale IP: $TAILSCALE_IP | $(date)"
          done
