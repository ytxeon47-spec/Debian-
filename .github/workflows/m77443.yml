name: Debian Linux RDP, VNC & noVNC via Ngrok

on:
  workflow_dispatch:

jobs:
  secure-rdp-vnc:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Free Up Root Disk Space (~30-40 GB)
        run: |
          echo "=== Freeing up disk space ==="
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          docker image prune --all --force || true
          sudo apt-get clean
          df -h

      - name: Install Desktop Environment, XRDP, TightVNC & noVNC
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 xfce4-goodies xrdp dbus-x11 zenity tightvncserver net-tools \
            novnc python3-websockify python3-numpy curl wget git
          
          sudo systemctl enable xrdp
          sudo systemctl start xrdp

      - name: Create RDP/VNC User with Fixed Password
        run: |
          PASSWORD="MXDEV123"
          USERNAME="MXDEV"
          
          if ! id -u "$USERNAME" >/dev/null 2>&1; then
              sudo useradd -m -s /bin/bash "$USERNAME"
              echo "$USERNAME:$PASSWORD" | sudo chpasswd
              sudo usermod -aG sudo "$USERNAME"
          fi
          
          sudo usermod -aG ssl-cert "$USERNAME"
          USER_HOME="/home/$USERNAME"
          
          # Fix D-Bus and XFCE Session for RDP
          echo "exec dbus-launch --exit-with-session startxfce4" | sudo tee "$USER_HOME/.xsession" > /dev/null
          
          # Setup VNC Configuration
          sudo mkdir -p "$USER_HOME/.vnc"
          echo "$PASSWORD" | sudo vncpasswd -f | sudo tee "$USER_HOME/.vnc/passwd" > /dev/null
          sudo chmod 600 "$USER_HOME/.vnc/passwd"
          
          cat << 'EOF' | sudo tee "$USER_HOME/.vnc/xstartup" > /dev/null
          #!/bin/bash
          xrdb $HOME/.Xresources
          startxfce4 &
          EOF
          sudo chmod +x "$USER_HOME/.vnc/xstartup"

          # Setup desktop startup welcome popup
          sudo mkdir -p "$USER_HOME/.config/autostart"
          cat << 'EOF' | sudo tee "$USER_HOME/.config/autostart/mxdev-welcome.desktop" > /dev/null
          [Desktop Entry]
          Type=Application
          Name=MX DEV Welcome
          Exec=bash -c "sleep 3 && zenity --info --title='Welcome from MX DEV' --text='Welcome! This session is provided by MX DEV.\n\nSubscribe to our Telegram channel for more methods and updates:\nhttps://t.me/mxdevrdp' --width=400"
          Hidden=false
          NoDisplay=false
          X-GNOME-Autostart-enabled=true
          EOF
          sudo chown -R "$USERNAME:$USERNAME" "$USER_HOME"
          
          # Start VNC Server as MXDEV user on display :1 (Port 5901)
          sudo su - "$USERNAME" -c "vncserver :1 -geometry 1280x720 -depth 24"
          
          echo "RDP_CREDS=$PASSWORD" >> $GITHUB_ENV
          echo "RDP_USER=$USERNAME" >> $GITHUB_ENV

      - name: Start noVNC Server
        run: |
          # Launch noVNC via websockify on port 6080 forwarding to VNC port 5901
          nohup websockify --web=/usr/share/novnc/ 6080 localhost:5901 > /dev/null 2>&1 &
          sleep 2

      - name: Install & Launch Ngrok (Main Connection)
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update && sudo apt-get install ngrok
          
          # Authenticate Ngrok
          if [ -n "${{ secrets.NGROK_AUTH_TOKEN }}" ]; then
            ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
          else
            echo "WARNING: NGROK_AUTH_TOKEN secret is missing!"
            exit 1
          fi
          
          # Start HTTP tunnel on port 6080 (noVNC)
          nohup ngrok http 6080 > /dev/null 2>&1 &
          sleep 5
          
          # Extract public Ngrok URL
          NGROK_URL=$(curl -s http://localhost:4040/api/tunnels | grep -o 'https://[^"]*' | head -n 1)
          echo "NGROK_URL=$NGROK_URL" >> $GITHUB_ENV

      - name: Verify Connections
        run: |
          echo "Ngrok URL: $NGROK_URL"
          
          if nc -z -v -w5 127.0.0.1 3389 2>/dev/null; then
              echo "RDP (Port 3389): Active"
          fi
          if nc -z -v -w5 127.0.0.1 5901 2>/dev/null; then
              echo "VNC (Port 5901): Active"
          fi
          if nc -z -v -w5 127.0.0.1 6080 2>/dev/null; then
              echo "noVNC (Port 6080): Active"
          fi

      - name: Maintain Connection + Output Access Details
        run: |
          echo -e "\n======================================================="
          echo " This session is brought to you by MX DEV!"
          echo " Subscribe to our Telegram channel for more methods:"
          echo " https://t.me/mxdevrdp"
          echo -e "=======================================================\n"
          
          echo -e "\n=== CONNECT INFO ==="
          echo "noVNC Web Browser Access: ${NGROK_URL}/vnc.html"
          echo "Username:                 $RDP_USER"
          echo "Password:                 $RDP_CREDS"
          echo -e "====================\n"
          
          while true; do
              echo "[$(date)] Session Active - Powered by MX DEV (https://t.me/mxdevrdp)"
              sleep 300
          done
