name: Custom Linux Mint 22.1 QEMU (Tailscale & noVNC)

on:
  workflow_dispatch:

jobs:
  run-mint-iso:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: 1. Install QEMU, KVM, OVMF & Storage (356GB)
        run: |
          echo "=== [STEP 1/4] Installing QEMU, KVM & UEFI Firmware ==="
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            qemu-utils \
            ovmf \
            novnc \
            websockify \
            curl \
            wget \
            aria2

          echo "=== Enabling KVM Permissions ==="
          sudo chmod 666 /dev/kvm || true

          echo "=== Creating Virtual Disk (356GB qcow2) ==="
          qemu-img create -f qcow2 /tmp/main_disk.qcow2 356G

      - name: 2. Download Linux Mint 22.1 XFCE ISO Image
        run: |
          echo "=== [STEP 2/4] Downloading Linux Mint 22.1 XFCE ISO ==="
          
          ISO_URL="https://archive.org/download/linuxmint-22.1-xfce-64bit/linuxmint-22.1-xfce-64bit.iso"
          
          echo "Downloading to /tmp/mint.iso..."
          aria2c -x 16 -s 16 -k 1M -d /tmp -o mint.iso "$ISO_URL" || wget -O /tmp/mint.iso "$ISO_URL"
          
          ls -lh /tmp/mint.iso

      - name: 3. Connect Tailscale
        run: |
          echo "=== [STEP 3/4] Connecting Tailscale ==="
          curl -fsSL https://tailscale.com/install.sh | sh
          
          sudo tailscale up \
            --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" \
            --hostname="mint-qemu-runner-${{ github.run_id }}" \
            --accept-routes || true
          
          TS_IP=""
          RETRIES=0
          while [ -z "$TS_IP" ] && [ $RETRIES -lt 10 ]; do
              TS_IP=$(tailscale ip -4 || true)
              sleep 3
              RETRIES=$((RETRIES+1))
          done
          
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: 4. Launch QEMU Linux Mint & noVNC Web Access
        run: |
          echo "=== [STEP 4/4] Starting QEMU Linux Mint Machine ==="
          
          # Launch QEMU with host CPU passthrough (maximum KVM performance)
          qemu-system-x86_64 \
            -enable-kvm \
            -m 12288 \
            -smp 4 \
            -cpu host \
            -bios /usr/share/ovmf/OVMF.fd \
            -drive file=/tmp/main_disk.qcow2,format=qcow2,index=0,media=disk \
            -drive file=/tmp/mint.iso,index=1,media=cdrom \
            -vga qxl \
            -boot d \
            -vnc 127.0.0.1:0 \
            -net nic,model=virtio \
            -net user \
            -usb -device usb-tablet \
            -daemonize

          sleep 5

          # Launch noVNC bridge
          NOVNC_DIR=$(dpkg -L novnc 2>/dev/null | grep -E 'vnc.html|index.html' | head -n 1 | xargs dirname)
          if [ -z "$NOVNC_DIR" ]; then NOVNC_DIR="/usr/share/novnc"; fi
          websockify --web "$NOVNC_DIR" 8006 127.0.0.1:5900 &
          sleep 2

          echo "=================================================="
          echo " LINUX MINT 22.1 QEMU RUNNER READY"
          echo "=================================================="
          echo " OS Image     : Linux Mint 22.1 XFCE"
          echo " CPU Model    : KVM Host CPU Passthrough (-cpu host)"
          echo " GPU          : QXL Virtual Graphics"
          echo " Tailscale IP : $TAILSCALE_IP"
          echo " Web VNC URL  : http://$TAILSCALE_IP:8006/vnc.html"
          echo " Storage Size : 356 GB (qcow2)"
          echo " RAM          : 12 GB"
          echo " CPU Cores    : 4 Cores"
          echo "=================================================="

          # Keep runner alive for 6 hours
          END_TIME=$(( $(date +%s) + 21600 ))
          while [ $(date +%s) -lt $END_TIME ]; do
            sleep 300
            echo "QEMU Linux Mint Running | Tailscale IP: $TAILSCALE_IP | $(date)"
          done
