name: Custom Windows 7 QEMU (Intel Pentium N3700 & Supermium Preloaded)

on:
  workflow_dispatch:

jobs:
  run-win7-supermium:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: 1. Install QEMU, KVM & Storage Tools
        run: |
          echo "=== [STEP 1/5] Installing QEMU, KVM & Storage Tools ==="
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            qemu-utils \
            novnc \
            websockify \
            curl \
            wget \
            aria2 \
            dosfstools \
            mtools

          echo "=== Enabling KVM Permissions ==="
          sudo chmod 666 /dev/kvm || true

          echo "=== Creating Main Virtual Disk (128GB qcow2) ==="
          qemu-img create -f qcow2 /tmp/main_disk.qcow2 128G

      - name: 2. Download Windows 7 ISO
        run: |
          echo "=== [STEP 2/5] Downloading Windows 7 ISO ==="
          
          ISO_URL="https://archive.org/download/windows-7-build-7264/Windows7_Build_7264_x64.iso"
          
          echo "Downloading ISO to /tmp/win7.iso..."
          aria2c -x 16 -s 16 -k 1M -d /tmp -o win7.iso "$ISO_URL" || wget -O /tmp/win7.iso "$ISO_URL"
          
          ls -lh /tmp/win7.iso

      - name: 3. Download Supermium Browser & Create Preloaded Disk
        run: |
          echo "=== [STEP 3/5] Downloading Supermium & Creating Extra Drive ==="
          
          SUPERMIUM_URL="https://download.win32subsystem.live/supermium/releases/v144-r5/supermium_144_64_setup.exe"
          
          echo "Downloading Supermium installer..."
          aria2c -x 16 -s 16 -k 1M -d /tmp -o supermium_144_64_setup.exe "$SUPERMIUM_URL" || wget -O /tmp/supermium_144_64_setup.exe "$SUPERMIUM_URL"
          
          echo "Creating 2GB FAT image drive for Windows (Drive D:)..."
          dd if=/dev/zero of=/tmp/supermium_disk.img bs=1M count=2000
          mkfs.vfat /tmp/supermium_disk.img
          
          # Копируем установочный файл прямо в корень образа диска
          mcopy -i /tmp/supermium_disk.img /tmp/supermium_144_64_setup.exe ::/supermium_144_64_setup.exe
          
          ls -lh /tmp/supermium_disk.img

      - name: 4. Connect Tailscale
        run: |
          echo "=== [STEP 4/5] Connecting Tailscale ==="
          curl -fsSL https://tailscale.com/install.sh | sh
          
          sudo tailscale up \
            --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" \
            --hostname="win7-qemu-runner-${{ github.run_id }}" \
            --accept-routes || true
          
          TS_IP=""
          RETRIES=0
          while [ -z "$TS_IP" ] && [ $RETRIES -lt 10 ]; do
              TS_IP=$(tailscale ip -4 || true)
              sleep 3
              RETRIES=$((RETRIES+1))
          done
          
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: 5. Launch QEMU Windows 7 & noVNC Web Access
        run: |
          echo "=== [STEP 5/5] Starting QEMU Windows 7 Machine ==="
          
          # Запуск QEMU: Intel Pentium N3700 (4 ядра / 4 потока), 8 GB RAM, Диск 128 ГБ + Диск D:
          qemu-system-x86_64 \
            -enable-kvm \
            -m 8192 \
            -smp 4,sockets=1,cores=4,threads=1 \
            -cpu host,model-id="Intel(R) Pentium(R) CPU N3700 @ 1.60GHz",check=false \
            -drive file=/tmp/main_disk.qcow2,format=qcow2,index=0,media=disk \
            -drive file=/tmp/win7.iso,index=1,media=cdrom \
            -drive file=/tmp/supermium_disk.img,format=raw,index=2,media=disk \
            -vga std \
            -boot d \
            -vnc 127.0.0.1:0 \
            -net nic,model=e1000 \
            -net user \
            -usb -device usb-tablet \
            -daemonize

          sleep 5

          # Настройка noVNC
          NOVNC_DIR="/usr/share/novnc"
          if [ -d "/usr/share/novnc/vnc_lite.html" ] || [ -f "/usr/share/novnc/vnc.html" ] || [ -f "/usr/share/novnc/index.html" ]; then
            NOVNC_DIR="/usr/share/novnc"
          elif [ -d "/usr/share/novnc" ]; then
            NOVNC_DIR="/usr/share/novnc"
          fi

          websockify --web "$NOVNC_DIR" 8006 127.0.0.1:5900 &
          sleep 2

          echo "=================================================="
          echo " WINDOWS 7 QEMU READY"
          echo "=================================================="
          echo " OS Image     : Windows 7 Build 7264 (x64)"
          echo " CPU Model    : Intel(R) Pentium(R) CPU N3700 @ 1.60GHz (4 Cores, 2015)"
          echo " RAM          : 8 GB (8192 MB)"
          echo " Storage Size : 128 GB Main Disk + Extra Drive D: (Supermium Preloaded)"
          echo " Preloaded File: D:\\supermium_144_64_setup.exe"
          echo " Tailscale IP : $TAILSCALE_IP"
          echo " Web VNC URL  : http://$TAILSCALE_IP:8006/vnc.html"
          echo "=================================================="

          # Удерживаем раннер 6 часов
          END_TIME=$(( $(date +%s) + 21600 ))
          while [ $(date +%s) -lt $END_TIME ]; do
            sleep 300
            echo "QEMU Running | Tailscale IP: $TAILSCALE_IP | $(date)"
          done
